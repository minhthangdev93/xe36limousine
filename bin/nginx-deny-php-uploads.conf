# Nginx — chặn thực thi PHP trong wp-content/uploads
# aaPanel: Website → xe36limousine.vn → Config → dán vào server { } (trước location ~ \.php$)
#
# location ~* ^/wp-content/uploads/.*\.(php|phtml|php3|php4|php5|php7|php8|phar)$ {
#     deny all;
# }

location ~* ^/wp-content/uploads/.*\.(php|phtml|php3|php4|php5|php7|php8|phar)$ {
	deny all;
	access_log off;
	log_not_found off;
}
